query_surface:
  description: >-
    Two operations read telemetry rather than configuration, and neither returns a modelled entity —
    POST /api/v2/charts/series returns SeriesResponse (ts_bucket plus per-series values), and
    POST /api/v2/search returns SearchResponse (SearchRow arrays). The row shape is determined by
    the Source's SELECT expressions, so it is not enumerable from the spec.
