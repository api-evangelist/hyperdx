aid: hyperdx
name: HyperDX
description: >-
  HyperDX is an open-source observability platform that unifies logs, metrics, traces, session
  replay and errors on top of ClickHouse and OpenTelemetry, giving engineers one place to search
  raw events, correlate a log line to its trace and that span to a session replay, build dashboards
  and run threshold alerts. It ships as an MIT-licensed self-hostable stack (the app, a Node.js API,
  an opinionated OpenTelemetry collector distribution and ClickHouse), as HyperDX Cloud at
  hyperdx.io, and as the user interface of ClickStack after ClickHouse acquired the company in
  March 2025. Its developer surface is a REST management API for dashboards, alerts, sources,
  saved searches, connections and webhooks, plus a first-party MCP server and an agent-friendly
  terminal CLI.
