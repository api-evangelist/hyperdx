- aid: hyperdx:hyperdx-mcp-server
  name: HyperDX (ClickStack) MCP Server
  description: >-
    First-party Model Context Protocol server shipped inside the HyperDX API package, served at /api/mcp
    on your instance over Streamable HTTP with Bearer authentication. Exposes 27 tools covering source
    discovery, metric catalogs, time series, tables, raw ClickHouse SQL, log pattern mining, emerging-signal
    detection, trace waterfalls, dashboards, saved searches, alerts and webhooks. Not available on HyperDX
    Cloud v1.
  humanURL: https://github.com/hyperdxio/hyperdx/blob/main/MCP.md
