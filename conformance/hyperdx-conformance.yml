name: HyperDX Standards Conformance
description: >-
  Cross-cutting and domain-standard conformance for HyperDX, asserted only where the contract or
  the vendor's own published surface shows it. HyperDX's market — observability — does have a
  domain standard, and HyperDX is built on it rather than merely claiming it.
standards:
- id: openapi
  name: OpenAPI Specification
  conforms: true
  version: 3.0.0
  evidence:
    location: openapi/hyperdx-external-api-openapi.json
    detail: >-
      Declares openapi 3.0.0, info.title "HyperDX External API", 39 operations across 7 tags, 143
      component schemas, and every operation carries an operationId, summary, tags and typed
      responses. Published in the vendor's own repo at packages/api/openapi.json.
- id: opentelemetry
  name: OpenTelemetry
  conforms: true
  domain_standard: true
  market: observability
  evidence:
    location: openapi/hyperdx-external-api-openapi.json components.schemas.LogSource / TraceSource / MetricSource
    detail: >-
      This is the domain-standard signature, and it is in the contract rather than on a marketing
      page. The Source schemas exist to map a ClickHouse table onto the OpenTelemetry data model
      field by field — timestampValueExpression, serviceNameExpression, serviceVersionExpression,
      severityTextExpression, bodyExpression, eventAttributesExpression, resourceAttributesExpression,
      traceIdExpression, spanIdExpression, parentSpanIdExpression, spanNameExpression,
      spanKindExpression, statusCodeExpression, durationExpression. MetricSource carries
      metricTables keyed by OTel metric kind (gauge, sum, histogram), and MetricDataType enumerates
      Sum/Gauge/Histogram. The 2.29.0 release added OpenTelemetry span links to the trace view.
    corroboration: >-
      Ingestion is OTLP — the published quickstart exposes receivers on 4317 (gRPC) and 4318 (HTTP),
      and the collector is an opinionated distribution of the OpenTelemetry Collector.
  note: >-
    A consumer already emitting OpenTelemetry integrates with no bespoke connector. This is the
    reward-only domain-standard check firing on real contract evidence.
- id: opamp
  name: Open Agent Management Protocol (OpAMP)
  conforms: true
  evidence:
    location: https://clickhouse.com/docs/use-cases/observability/clickstack/ingesting-data/otel-collector
    detail: >-
      The ClickStack collector distribution includes an OpAMP supervisor that pulls its OTLP
      endpoint configuration from the HyperDX API. Documented by the vendor; not probed here.
- id: promql
