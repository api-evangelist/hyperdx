notes:
- The MCP surface is not a mechanical projection of the REST surface. Eight tools — metric catalog,
  pattern mining, deltas, emerging signals, raw SQL and the two trace-analysis tools — are the
  analysis layer, and they exist only for agents.
- Twelve REST operations, all of team and connection administration plus two deletes, have no tool.
  An agent cannot invite a teammate or rotate a ClickHouse connection through MCP.
