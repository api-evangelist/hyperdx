mcp_only:
- tool: clickstack_list_metrics
  reason: No REST operation enumerates metric names on a metric source.
- tool: clickstack_describe_metric
  reason: No REST operation returns per-metric kind/unit/attribute-key drill-down.
- tool: clickstack_event_patterns
  reason: Drain log-pattern clustering is not exposed as a REST operation.
- tool: clickstack_event_deltas
  reason: Two-group property-distribution comparison is not exposed as a REST operation.
- tool: clickstack_emerging_signals
  reason: Two-window Drain novelty diff is not exposed as a REST operation.
- tool: clickstack_sql
  reason: >-
    Raw ClickHouse SQL passthrough. The External API v2 has no raw-SQL operation; the CLI reaches it
    through the HyperDX proxy, not through /api/v2.
- tool: clickstack_trace_waterfall
  reason: Span-tree assembly with correlated logs is server-side only; no REST operation returns it.
- tool: clickstack_trace_top_time_consuming_operations
  reason: Cumulative child-operation aggregation across matching parent traces has no REST equivalent.
