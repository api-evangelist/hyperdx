  reason: MCP exposes get/save for alerts but no delete tool.
- operationId: deleteSavedSearch
  reason: MCP exposes get/save for saved searches but no delete tool.
- operationId: createConnection
  reason: Connection writes are REST-only; MCP only reads connections via clickstack_list_sources.
- operationId: getConnection
  reason: Connection detail is REST-only.
- operationId: updateConnection
