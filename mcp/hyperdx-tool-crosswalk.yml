source: mcp/hyperdx-mcp.yml + openapi/hyperdx-external-api-openapi.json
name: HyperDX MCP <-> REST Tool Crosswalk
description: >-
  Binds each of the 27 ClickStack MCP tools to the HyperDX External API v2 operations that back it,
  so an agent can see which tool is a thin wrapper over a documented REST operation (and therefore
  inherits that operation's parameters and requestBody as its real inputSchema) and which tool has
  no public REST equivalent at all.
surfaces:
  openapi:
    path: openapi/hyperdx-external-api-openapi.json
    title: HyperDX External API
    version: 2.0.0
    operations: 39
    gated: false
    note: Spec is public in the hyperdxio/hyperdx repo; calling it needs a Bearer personal API key.
  mcp:
    url: '{your-hyperdx-url}/api/mcp'
    transport: streamable-http
    gated: true
    note: >-
      Live tools/list requires an authenticated session against a running instance, so tool
      inputSchemas were not read. Bindings below are by name and documented semantics.
  graphql:
    endpoint: null
    note: HyperDX publishes no GraphQL surface.
crosswalk:
- tool: clickstack_list_sources
  category: sources
  rest: [listSources, listConnections]
  binding: composite
  confidence: high
  note: One tool folds the source catalog and the ClickHouse connection catalog into a single listing.
- tool: clickstack_describe_source
  category: sources
  rest: [getSource]
  binding: extends
  confidence: medium
  note: >-
    Returns the REST source object plus column schema, attribute keys and sampled low-cardinality
    values that the REST operation does not compute.
- tool: clickstack_save_source
  category: sources
  rest: [createSource, updateSource]
  binding: upsert
  confidence: high
  note: Omit id -> createSource; provide id -> updateSource.
- tool: clickstack_delete_source
  category: sources
  rest: [deleteSource]
  binding: direct
