entries:
- version: 2.36.0
  date: '2026-08-21'
  breaking:
  - >-
    The API's log level now defaults to `info` and query SQL is no longer dumped to the console —
    set HYPERDX_LOG_LEVEL=debug to restore it (#2679).
  additions:
  - Formulas on metric, log and trace charts (letter-ref arithmetic over a chart's own series).
  - Formulas readable and writable over the external API, MCP save_dashboard/patch_dashboard, and the CLI.
  - Up to ten notification webhooks per alert; Edit/Delete on the alert details page.
  - Personal API access key can now be rotated.
  - Per-signal ClickHouse table TTLs, configurable exporter timeout, new /ready probe.
- version: 2.35.0
  date: '2026-08-14'
  breaking:
  - >-
    Terraform export emits team-scoped import ids (<team_id>/<resource_id>); provider floor moves
    to >= 3.25.0 and import files from earlier releases carry the old bare ids (#2898).
  additions:
  - 'Alert evaluation history over the API: GET /alerts/:id/evaluations returns per-window results.'
- version: 2.34.0
  date: '2026-08-07'
  breaking:
  - >-
    Time charts cap high-cardinality series by default. Over the external dashboards API the
    per-tile series limit is now three-state — omit for the default cap, 0 for unlimited, or a
    positive N — so a client that relied on omitting the field to get every series must send 0 (#2802).
  additions:
  - Export existing dashboards, saved searches and alerts to Terraform.
