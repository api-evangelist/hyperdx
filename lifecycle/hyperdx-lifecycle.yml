name: HyperDX API Lifecycle
description: >-
  Versioning, deprecation and operational-status posture for the HyperDX APIs, read from the
  vendor's own changelog, OpenAPI and status page.
versioning:
  strategy: path
  pattern: /api/v{n}
  current: v2
  previous: v1
  spec_version: 2.0.0
  product_version: 2.36.0
  scheme: semver
  note: >-
    Two live major versions with different homes. v1 is HyperDX Cloud at api.hyperdx.io and is
    documented only as prose on hyperdx.io/docs/api. v2 is the "External API", shipped with the
    open-source/self-hosted build and with ClickStack, and it is the version that has an OpenAPI.
    GET https://api.hyperdx.io/api/v2/alerts returned 404 on 2026-08-27, confirming v2 is not
    served on the v1 Cloud host.
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  breaking_change_communication: changelog
  breaking_change_url: https://github.com/hyperdxio/hyperdx/blob/main/CHANGELOG.md
  note: >-
    HyperDX publishes no formal deprecation policy and sends no Deprecation/Sunset headers, and no
    operation in the v2 OpenAPI is marked deprecated. What it does do is name every breaking change
    under an explicit "💥 Breaking Changes" heading in each release, with the migration action
    stated — e.g. 2.34.0 changed the external dashboards API per-tile series limit to a three-state
    value and told clients relying on omission to start sending 0. That is a change log, not a
    deprecation contract: there is no advertised notice window.
breaking_changes_recent:
- version: 2.36.0
  date: '2026-08-21'
  change: API default log level moves from debug to info; query SQL no longer printed.
- version: 2.35.0
  date: '2026-08-14'
  change: Terraform export emits team-scoped import ids; provider floor >= 3.25.0.
- version: 2.34.0
  date: '2026-08-07'
  change: External dashboards API per-tile series limit becomes three-state; omission now means "default cap", not "all".
- version: 2.29.0
  date: '2026-06-30'
  change: Webhook destinations validated against SSRF protections; internal hosts need WEBHOOK_HOSTNAME_ALLOWLIST.
